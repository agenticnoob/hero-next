name: Review GitHub project content

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-next-project-content
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.scan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Leave an existing review intact
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh pr list --state open --head axmorf/project-content --json number --jq 'length')
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "An existing project-content PR is waiting for review; no model call or overwrite." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Scan public repository sources
        if: steps.pending.outputs.exists != 'true'
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-projects.mjs scan "$RUNNER_TEMP/project-sync"

      - name: Preserve sources for the isolated generation job
        if: steps.scan.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-content-sources
          path: |
            ${{ runner.temp }}/project-sync/plan.json
            ${{ runner.temp }}/project-sync/prompt.md
          if-no-files-found: error
          retention-days: 3

  generate:
    needs: collect
    if: needs.collect.outputs.changed == 'true' && github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Environment secrets are read at job start, after the workflow concurrency
    # lock. Repository secrets are captured when queued and can contain old tokens.
    environment: project-content
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: project-content-sources
          path: ${{ runner.temp }}/project-sync
      - name: Verify the repository is still private
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
      - name: Build the pinned isolated Codex runtime before loading credentials
        run: |
          docker build --tag hero-project-codex:0.155.1 --file .github/codex/runner.Dockerfile .github/codex
          docker run --rm hero-project-codex:0.155.1 --version
          cp .github/codex/projects-schema.json "$RUNNER_TEMP/project-sync/schema.json"
      - name: Restore a dedicated subscription login
        id: auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: node scripts/project-auth.mjs restore "$RUNNER_TEMP/project-sync"
      - name: Verify credential writeback before consuming the login
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
        run: node scripts/project-auth.mjs persist "$RUNNER_TEMP/project-sync"
      - name: Summarize changed sources using the subscription
        run: node scripts/project-auth.mjs generate "$RUNNER_TEMP/project-sync"
      - name: Stop any interrupted model process before saving authentication
        id: stopped
        if: always() && steps.auth.outcome == 'success'
        run: |
          container=$(docker ps --all --quiet --filter "name=^/hero-project-codex-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT$")
          if [ -n "$container" ]; then docker rm --force "$container" >/dev/null; fi
      - name: Preserve refreshed login even when generation fails
        if: always() && steps.auth.outcome == 'success' && steps.stopped.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
        run: node scripts/project-auth.mjs persist "$RUNNER_TEMP/project-sync"

      - name: Preserve the unmodified source plan and structured response
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-content-inputs
          path: |
            ${{ runner.temp }}/project-sync/plan.json
            ${{ runner.temp }}/project-sync/generated.json
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary authentication and model state
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/project-sync/codex-home" "$RUNNER_TEMP/project-sync/model-output"
          rm -f "$RUNNER_TEMP/project-sync/auth-before.json"

  review:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: project-content-inputs
          path: ${{ runner.temp }}/project-sync
      - name: Validate and compose trusted project data
        run: node scripts/sync-projects.mjs apply "$RUNNER_TEMP/project-sync"
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare a synthetic journal for the isolated build check
        run: |
          mkdir -p "$RUNNER_TEMP/project-check/journal"
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const root = `${process.env.RUNNER_TEMP}/project-check`;
          await writeFile(`${root}/journal/2000-01-01.json`, JSON.stringify({date:'2000-01-01',body:{今天用了啥:['CI fixture']}}));
          await writeFile(`${root}/TIMELINE.json`, JSON.stringify({timeline:[{date:'2000-01-01',event:'Synthetic build-check fixture; never deploy.'}]}));
          NODE
          npm run sync:journal -- --source "$RUNNER_TEMP/project-check"
      - name: Verify the complete candidate in this run
        run: |
          npm exec -- prettier --write data/projects.json
          npm run check
          npm run build
          git diff --check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const paths = execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if (paths.some(path => path !== 'data/projects.json')) throw new Error('Unexpected tracked file mutation');
          NODE
      - name: Reject a superseded website revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current=$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo "::error::The website changed during generation. Rerun against its current revision."
            exit 1
          fi
          pending=$(gh pr list --state open --head axmorf/project-content --json number --jq 'length')
          if [ "$pending" -gt 0 ]; then
            echo "::error::A content review opened during generation. Preserve it and rerun after review."
            exit 1
          fi
      - name: Open the content-only review
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: axmorf/project-content
          commit-message: "content: refresh public GitHub projects"
          title: "content: refresh public GitHub projects"
          add-paths: data/projects.json
          body: |
            Refreshes the generated project directory from selected public GitHub README snapshots. The four manually written case studies remain unchanged. Repository identities and source links are composed by trusted scripts; bilingual copy is generated and requires editorial review.

            This workflow validated the structured data, ran the complete quality gate and production build with a synthetic journal fixture, and checked the diff before opening this PR. No deployment occurred. Review the source commit links, factual claims and both languages before merging. Removing a repository or topic never automatically deletes published entries.

            A PR created with GITHUB_TOKEN does not trigger other pull_request workflows. Validation deliberately runs in this originating workflow. A human merge to main starts the existing production workflow, which fetches the real journal data. Do not auto-merge this PR.
